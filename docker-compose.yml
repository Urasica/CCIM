services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ccim
      POSTGRES_PASSWORD: ${CCIM_POSTGRES_PASSWORD:-ccim-local-only}
      POSTGRES_DB: ccim
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccim -d ccim"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  migrate:
    image: ${CCIM_IMAGE_REF:-ccim:local}
    build:
      context: .
      args:
        VCS_REF: ${CCIM_BUILD_REF:-local}
    command: ["python", "-m", "ccim.migrations", "apply"]
    environment:
      CCIM_DATABASE_URL: postgresql+psycopg://ccim:${CCIM_POSTGRES_PASSWORD:-ccim-local-only}@postgres:5432/ccim
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - backend

  gateway:
    image: ${CCIM_IMAGE_REF:-ccim:local}
    build:
      context: .
      args:
        VCS_REF: ${CCIM_BUILD_REF:-local}
    restart: unless-stopped
    env_file:
      - path: ${CCIM_RUNTIME_ENV_FILE:-.env}
        required: false
    environment:
      CCIM_HOST: 0.0.0.0
      CCIM_PORT: 8080
      CCIM_REDIS_URL: redis://redis:6379/0
      CCIM_DATABASE_URL: postgresql+psycopg://ccim:${CCIM_POSTGRES_PASSWORD:-ccim-local-only}@postgres:5432/ccim
      CCIM_EVIDENCE_STORE_PATH: /var/lib/ccim/evidence/evidence.sqlite3
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - evidence-data:/var/lib/ccim/evidence
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=2)
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    networks:
      - backend
      - edge

networks:
  backend:
    internal: true
  edge:

volumes:
  redis-data:
  postgres-data:
  evidence-data:
