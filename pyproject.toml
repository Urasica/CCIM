[project]
name = "ccim"
version = "0.1.0"
description = "Coding-agent Context & Integrity Middleware (V1 Foundation)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "urasica" }]

dependencies = [
    # API gateway
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "starlette>=0.41.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    # Settings & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # AST compression
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    # Storage
    "redis[hiredis]>=5.1.0",
    "asyncpg>=0.30.0",
    "psycopg[binary,pool]>=3.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    # LLM client
    "anthropic>=0.40.0",
    # Telemetry
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-exporter-otlp>=1.30.0",
    # Tokenization (fallback estimator)
    "tiktoken>=0.8.0",
    # Logging
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0.20241004",
]

[project.scripts]
ccim = "ccim.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccim"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["tests/compare/workspace"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --tb=short"
markers = [
    "integration: requires running Redis + PostgreSQL",
    "ollama: requires running Ollama instance",
    "slow: takes >1s",
]

[tool.coverage.run]
branch = true
relative_files = true
source = ["ccim"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "aiosqlite>=0.20.0",
]
