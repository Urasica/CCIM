name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  static:
    name: Static contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.30"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Verify lockfile and environment
        run: |
          uv lock --check
          uv sync --locked --all-extras --all-groups
      - name: Ruff
        run: uv run --no-sync ruff check src tests tools/admin_ui tests/compare scripts
      - name: Documentation and whitespace
        run: |
          uv run --no-sync python scripts/check_markdown_links.py
          git show --check --oneline --no-patch HEAD

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.30"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups
      - name: Run unit tests
        id: unit-tests
        continue-on-error: true
        run: |
          mkdir -p artifacts/raw
          uv run --no-sync pytest tests/unit -q \
            --cov=ccim \
            --cov-report=json:artifacts/raw/coverage.json \
            --junitxml=artifacts/raw/unit.xml
      - name: Build safe unit summary
        if: always()
        run: |
          uv run --no-sync python scripts/summarize_ci.py \
            --suite unit \
            --junit artifacts/raw/unit.xml \
            --coverage artifacts/raw/coverage.json \
            --output artifacts/unit-summary.json
          uv run --no-sync python scripts/check_artifact_safety.py artifacts/unit-summary.json
      - name: Upload unit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-summary
          path: artifacts/unit-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Enforce unit result
        if: steps.unit-tests.outcome != 'success'
        run: exit 1

  integration:
    name: Mock integration, migration, semantic
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ccim
          POSTGRES_PASSWORD: ccim-ci-only
          POSTGRES_DB: ccim
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ccim -d ccim"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CCIM_REDIS_URL: redis://127.0.0.1:6379/0
      CCIM_DATABASE_URL: postgresql+psycopg://ccim:ccim-ci-only@127.0.0.1:5432/ccim
      CCIM_TEST_DATABASE_URL: postgresql+psycopg://ccim:ccim-ci-only@127.0.0.1:5432/ccim
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.30"
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras --all-groups
      - name: Apply and inspect migrations
        run: |
          mkdir -p artifacts/raw
          uv run --no-sync python -m ccim.migrations apply
          uv run --no-sync python -m ccim.migrations check --json > artifacts/migration-summary.json
      - name: Run operational-data readiness dry-run
        run: |
          uv run --no-sync python -m ccim.operations dry-run \
            --output artifacts/operational-readiness.json
          uv run --no-sync python scripts/check_artifact_safety.py \
            artifacts/operational-readiness.json
      - name: Run mock and infrastructure integration
        id: integration-tests
        continue-on-error: true
        run: |
          uv run --no-sync pytest tests/integration -m "not ollama" -q \
            --junitxml=artifacts/raw/integration.xml
      - name: Run deterministic semantic fixture
        id: semantic
        continue-on-error: true
        run: |
          uv run --no-sync python tests/compare/check_task2_semantics.py \
            tests/fixtures/task2_golden > artifacts/semantic-report.txt
      - name: Build safe integration summary
        if: always()
        run: |
          uv run --no-sync python scripts/summarize_ci.py \
            --suite integration \
            --junit artifacts/raw/integration.xml \
            --output artifacts/integration-summary.json
          uv run --no-sync python scripts/check_artifact_safety.py \
            artifacts/integration-summary.json \
            artifacts/migration-summary.json \
            artifacts/operational-readiness.json \
            artifacts/semantic-report.txt
      - name: Upload integration summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-summary
          path: |
            artifacts/integration-summary.json
            artifacts/migration-summary.json
            artifacts/operational-readiness.json
            artifacts/semantic-report.txt
          if-no-files-found: error
          retention-days: 14
      - name: Enforce integration and semantic results
        if: steps.integration-tests.outcome != 'success' || steps.semantic.outcome != 'success'
        run: exit 1

  image:
    name: SHA image and readiness smoke
    runs-on: ubuntu-latest
    needs: [static, unit, integration]
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable candidate
        run: |
          docker build \
            --build-arg VCS_REF=${{ github.sha }} \
            --tag ccim:${{ github.sha }} \
            .
      - name: Validate Compose contract
        env:
          CCIM_IMAGE_TAG: ${{ github.sha }}
          CCIM_POSTGRES_PASSWORD: ccim-smoke-only
        run: docker compose config --quiet
      - name: Start stack and verify readiness
        env:
          CCIM_IMAGE_TAG: ${{ github.sha }}
          CCIM_POSTGRES_PASSWORD: ccim-smoke-only
        run: |
          docker compose up -d --wait
          curl --fail --silent http://127.0.0.1:8080/live > /tmp/ccim-live.json
          curl --fail --silent http://127.0.0.1:8080/ready > /tmp/ccim-ready.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          live = json.loads(Path('/tmp/ccim-live.json').read_text())
          ready = json.loads(Path('/tmp/ccim-ready.json').read_text())
          assert live['status'] == 'live'
          assert ready['status'] == 'ready'
          assert ready['dependencies']['migrations']['current'] is True
          PY
      - name: Record image evidence
        env:
          PYTHONPATH: src
        run: |
          mkdir -p artifacts
          image_id=$(docker image inspect --format='{{.Id}}' ccim:${{ github.sha }})
          python3 - "$image_id" "${{ github.sha }}" <<'PY'
          import json
          import sys
          from pathlib import Path

          Path('artifacts/image-summary.json').write_text(
              json.dumps(
                  {
                      'schema': 'ccim-image-summary-v1',
                      'revision': sys.argv[2],
                      'image_id': sys.argv[1],
                      'live': 'pass',
                      'ready': 'pass',
                      'migration': 'current',
                  },
                  indent=2,
              ) + '\n',
              encoding='utf-8',
          )
          PY
          python3 scripts/check_artifact_safety.py artifacts/image-summary.json
      - name: Upload image summary
        uses: actions/upload-artifact@v4
        with:
          name: image-summary
          path: artifacts/image-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Stop smoke stack
        if: always()
        env:
          CCIM_IMAGE_TAG: ${{ github.sha }}
          CCIM_POSTGRES_PASSWORD: ccim-smoke-only
        run: docker compose down --volumes --remove-orphans
